<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechnoSupport — Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Admin üst bar -->
<div class="admin-topbar">
    <div class="brand" data-i18n-html="brand">Techno<span>Support</span></div>
    <div>
        <a href="index.html" class="btn btn-ghost" data-i18n="siteTitle">Siteye Dön</a>
        <button id="navLogoutBtn" class="btn btn-primary" data-i18n="navLogout" style="display:none;">Çıkış</button>
    </div>
</div>

<div class="admin-container">
    <h1 style="margin-bottom:16px; color:#1f2937;" data-i18n="adminTitle">Destek Talepleri — Yönetim Paneli</h1>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <button id="adminRefresh" class="btn btn-primary" data-i18n="adminRefresh">Yenile</button>
        <span class="hint">Tüm destek talepleri burada listelenir. Yanıt yazabilir, talebi açabilir veya kapatabilirsiniz.</span>
    </div>

    <table class="admin-table">
        <thead>
            <tr>
                <th style="width:60px;">ID</th>
                <th data-i18n="from">Müşteri</th>
                <th data-i18n="subjectPlaceholder">Konu</th>
                <th style="width:140px;">Durum</th>
                <th style="width:260px;">İşlem</th>
            </tr>
        </thead>
        <tbody id="adminTicketList"></tbody>
    </table>
</div>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    applyTheme();
    applyLang();

    const logoutBtn = document.getElementById('navLogoutBtn');
    if (!isAdminLoggedIn()) {
        // Giriş yapılmamışsa giriş formunu göster
        document.body.innerHTML = `
        <div class="admin-topbar">
            <div class="brand" data-i18n-html="brand">Techno<span>Support</span></div>
        </div>
        <div class="admin-container" style="max-width:400px;">
            <h2 style="margin-bottom:24px; color:#1f2937;" data-i18n="adminLogin">Admin Girişi</h2>
            <form id="adminLoginForm">
                <label data-i18n="adminUser">Kullanıcı Adı</label>
                <input type="text" id="loginUser" autocomplete="username" required>
                <label data-i18n="adminPass">Şifre</label>
                <input type="password" id="loginPass" autocomplete="current-password" required>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;" data-i18n="adminLoginBtn">Giriş Yap</button>
            </form>
        </div>
        `;
        applyLang();
        document.getElementById('adminLoginForm')?.addEventListener('submit', async e => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const ok = await adminLogin(user, pass);
            if (ok) {
                location.reload();
            } else {
                alert('Kullanıcı adı veya şifre hatalı.');
            }
        });
        return;
    }

    // Zaten giriş yapmış
    if (logoutBtn) {
        logoutBtn.style.display = 'inline-block';
        logoutBtn.addEventListener('click', () => {
            adminLogout();
            location.href = 'admin.html';
        });
    }

    // i18n uygula
    const lang = localStorage['ts-lang'] || 'tr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (FE_I18N[lang] && FE_I18N[lang][k]) el.textContent = FE_I18N[lang][k];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const k = el.getAttribute('data-i18n-placeholder');
        if (FE_I18N[lang] && FE_I18N[lang][k]) el.placeholder = FE_I18N[lang][k];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const k = el.getAttribute('data-i18n-html');
        if (FE_I18N[lang] && FE_I18N[lang][k]) el.innerHTML = FE_I18N[lang][k];
    });

    const theme = localStorage['ts-theme'] || 'light';
    if (theme === 'light') document.body.classList.add('light');

    renderAdmin();
    document.getElementById('adminRefresh')?.addEventListener('click', renderAdmin);
});
</script>
</body>
</html>
